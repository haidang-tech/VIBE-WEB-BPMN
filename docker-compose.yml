services:
  postgres:
    image: postgres:16-alpine
    container_name: due-blood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: due_blood
    ports:
      # 5433 ở máy host để tránh đụng PostgreSQL local đang chạy ở 5432
      - "5433:5432"
    volumes:
      - due_blood_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d due_blood"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  due_blood_pgdata:
